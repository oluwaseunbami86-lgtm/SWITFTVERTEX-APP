{% extends "base.html" %}
{% block title %}{{ title }} - SurveyCo{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ title }}</h1></div>
<div class="card" style="max-width:520px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions-row">
            <button type="submit" class="btn btn-primary">Save client</button>
        </div>
    </form>
</div>
{% endblock %}
